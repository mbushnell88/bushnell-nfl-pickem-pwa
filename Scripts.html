<script>
const S={
  token:'',
  bootstrap:null,
  data:null,
  selectedPlayer:'',
  stageKey:'REG-1'
};

const $=id=>document.getElementById(id);

const call=(fn,...args)=>new Promise((resolve,reject)=>
  google.script.run
    .withSuccessHandler(resolve)
    .withFailureHandler(reject)[fn](...args)
);

const API={
  bootstrap:()=>call('getBootstrap'),
  init:(a,p,t,n)=>call('initializePool',a,p,t,n),
  login:(id,p)=>call('loginPlayer',id,p),

  resume:t=>call('resumeSession',t),
  logout:t=>call('logout',t),
  state:t=>call('getAppState',t),
  stage:(t,k)=>call('getStageData',t,k),

  pick:(t,g,team)=>call('savePick',t,g,team),
  tie:(t,k,v)=>call('saveTiebreaker',t,k,v),
  publicPicks:(t,g)=>call('getPublicPicksForGame',t,g),

  add:(t,n,e,phone,p,team,r,emailReminders,smsReminders)=>call('addPlayer',t,n,e,phone,p,team,r,emailReminders,smsReminders),
  update:(t,id,c)=>call('updatePlayer',t,id,c),
  current:(t,k)=>call('setCurrentStage',t,k),

  season:(t,s)=>call('setActiveSeason',t,s),
  refresh:(t,k)=>call('refreshStageFromEspn',t,k),
  refreshAll:t=>call('refreshFullSeasonFromEspn',t),

  manual:(t,g)=>call('adminUpsertManualGame',t,g),
  finalize:(t,n)=>call('finalizeSeason',t,n),

  autoOn:t=>call('installAutoRefresh',t),
  autoOff:t=>call('removeAutoRefresh',t),
  remind:t=>call('sendPickReminderEmails',t),

  history:(t,s)=>call('getSeasonHistory',t,s),
  profile:(t,id)=>call('getPlayerProfile',t,id)
};


/* =========================================================
   TEAM LOGOS
   ========================================================= */

function teamLogoUrl(abbr){
  const key=String(abbr||'')
    .trim()
    .toLowerCase();

  if(!key || key==='nfl'){
    return '';
  }

  return 'https://a.espncdn.com/i/teamlogos/nfl/500/' +
    encodeURIComponent(key) +
    '.png';
}


function teamLogoMarkup(abbr,size,className){
  const clean=String(abbr||'NFL')
    .trim()
    .toUpperCase();

  const logoSize=Number(size)||42;
  const extraClass=className||'';
  const url=teamLogoUrl(clean);

  if(!url){
    return (
      '<span class="team-logo-shell team-logo-fallback-only ' +
      esc(extraClass) +
      '" style="--logo-size:' +
      logoSize +
      'px;width:' +
      logoSize +
      'px;height:' +
      logoSize +
      'px;flex:0 0 ' +
      logoSize +
      'px">' +

        '<span class="team-logo-fallback">' +
          esc(clean) +
        '</span>' +

      '</span>'
    );
  }

  return (
    '<span class="team-logo-shell ' +
    esc(extraClass) +
    '" style="--logo-size:' +
    logoSize +
    'px;width:' +
    logoSize +
    'px;height:' +
    logoSize +
    'px;flex:0 0 ' +
    logoSize +
    'px">' +

      '<img class="team-logo-img" ' +
      'src="' +
      esc(url) +
      '" ' +
      'alt="' +
      esc(teamName(clean)) +
      ' logo" ' +
      'loading="lazy">' +

      '<span class="team-logo-fallback">' +
        esc(clean) +
      '</span>' +

    '</span>'
  );
}


/* =========================================================
   GLOBAL BUSY / LOADING FEEDBACK
   ========================================================= */

let BUSY_COUNT=0;

function ensureBusyUi(){
  if(!document.getElementById('globalBusyStyle')){
    const style=document.createElement('style');

    style.id='globalBusyStyle';

    style.textContent=`
      #globalBusyOverlay{
        position:fixed;
        inset:0;
        z-index:9999;

        display:flex;
        align-items:flex-start;
        justify-content:center;

        padding-top:72px;

        background:rgba(4,10,16,.18);
        backdrop-filter:blur(1.5px);

        opacity:0;
        visibility:hidden;
        pointer-events:none;

        transition:
          opacity .16s ease,
          visibility .16s ease;
      }

      #globalBusyOverlay.show{
        opacity:1;
        visibility:visible;
        pointer-events:all;
        cursor:wait;
      }

      .global-busy-card{
        display:flex;
        align-items:center;
        gap:12px;

        min-width:190px;
        max-width:min(420px,calc(100vw - 30px));

        padding:13px 18px;

        border:1px solid color-mix(
          in srgb,
          var(--secondary) 45%,
          rgba(255,255,255,.15)
        );

        border-radius:999px;

        background:rgba(7,16,24,.96);
        color:#fff;

        box-shadow:
          0 14px 45px rgba(0,0,0,.45),
          0 0 0 1px rgba(255,255,255,.03);

        font-size:13px;
        font-weight:900;
        letter-spacing:.02em;
      }

      .global-busy-spinner{
        width:20px;
        height:20px;
        flex:0 0 20px;

        border-radius:50%;

        border:3px solid rgba(255,255,255,.20);
        border-top-color:var(--secondary);

        animation:globalBusySpin .65s linear infinite;
      }

      #globalBusyMessage{
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
      }

      body.app-busy{
        cursor:wait;
      }

      @keyframes globalBusySpin{
        to{
          transform:rotate(360deg);
        }
      }

      @media(max-width:780px){
        #globalBusyOverlay{
          padding-top:58px;
        }

        .global-busy-card{
          font-size:12px;
          padding:11px 15px;
        }
      }
    `;

    document.head.appendChild(style);
  }

  if(!document.getElementById('globalBusyOverlay')){
    const overlay=document.createElement('div');

    overlay.id='globalBusyOverlay';

    overlay.innerHTML=`
      <div class="global-busy-card">
        <div class="global-busy-spinner"></div>
        <div id="globalBusyMessage">
          Working...
        </div>
      </div>
    `;

    document.body.appendChild(overlay);
  }
}


function setBusy(message='Working...'){
  ensureBusyUi();

  BUSY_COUNT++;

  const overlay=$('globalBusyOverlay');
  const msg=$('globalBusyMessage');

  if(msg){
    msg.textContent=message;
  }

  if(overlay){
    overlay.classList.add('show');
  }

  document.body.classList.add('app-busy');
  document.body.setAttribute('aria-busy','true');
}


function clearBusy(){
  BUSY_COUNT=Math.max(0,BUSY_COUNT-1);

  if(BUSY_COUNT>0){
    return;
  }

  const overlay=$('globalBusyOverlay');

  if(overlay){
    overlay.classList.remove('show');
  }

  document.body.classList.remove('app-busy');
  document.body.removeAttribute('aria-busy');
}


async function busyAction(message,action){
  setBusy(message);

  try{
    return await action();
  }finally{
    clearBusy();
  }
}


/* =========================================================
   STARTUP / LOGIN
   ========================================================= */

async function start(){
  try{
    S.bootstrap=await API.bootstrap();

    fillTeamSelects();

    if(!S.bootstrap.initialized){
      showOnly('setupView');
      return;
    }

    const saved=
      localStorage.getItem(
        'bushnell_pickem_token'
      );

    if(saved){
      try{
        const x=
          await API.resume(saved);

        S.token=saved;
        S.data=x.bootstrap;
        S.stageKey=S.data.currentStage;

        enterApp();
        return;

      }catch(e){
        localStorage.removeItem(
          'bushnell_pickem_token'
        );
      }
    }

    buildLogin();
    showOnly('loginView');

  }catch(e){
    showOnly('loginView');
    err(e);
  }
}


function showOnly(id){
  [
    'loadingView',
    'setupView',
    'loginView',
    'mainView'
  ].forEach(
    x=>
      $(x).classList.toggle(
        'hidden',
        x!==id
      )
  );
}


function fillTeamSelects(){
  const opts=
    (S.bootstrap.teams||[])
      .map(t=>`
        <option value="${t.abbr}">
          ${esc(t.name)}
        </option>
      `)
      .join('');

  $('setupTeam').innerHTML=opts;
  $('setupTeam').value='MIN';
}


function buildLogin(){
  $('loginPool').textContent=
    S.bootstrap.poolName;

  $('loginSeason').textContent=
    S.bootstrap.season+
    " NFL PICK'EM";

  $('playerTiles').innerHTML=
    (S.bootstrap.players||[])
      .map(p=>`
        <button
          class="player-tile"
          onclick="
            selectPlayer(
              '${p.playerId}',
              this
            )
          "
        >

          ${teamLogoMarkup(
            p.favoriteTeam,
            34,
            'login-team-logo'
          )}

          <span class="player-tile-copy">
            <b>
              ${esc(p.displayName)}
            </b>

            <small>
              ${esc(teamName(p.favoriteTeam))}
            </small>
          </span>

        </button>
      `)
      .join('');

  if(S.bootstrap.players.length){
    selectPlayer(
      S.bootstrap.players[0].playerId,
      $('playerTiles').firstElementChild
    );
  }
}


async function initializePool(){
  await busyAction(
    'Creating pool...',
    async()=>{
      try{
        await API.init(
          $('setupName').value,
          $('setupPin').value,
          $('setupTeam').value,
          $('setupPool').value
        );

        location.reload();

      }catch(e){
        err(e);
      }
    }
  );
}


function selectPlayer(id,el){
  S.selectedPlayer=id;

  document
    .querySelectorAll('.player-tile')
    .forEach(
      x=>
        x.classList.remove('selected')
    );

  if(el){
    el.classList.add('selected');
  }

  const p=
    S.bootstrap.players.find(
      x=>x.playerId===id
    );

  if(p){
    theme(p.favoriteTeam);
  }
}


async function login(){
  await busyAction(
    'Signing in...',
    async()=>{
      try{
        if(!S.selectedPlayer){
          throw new Error(
            'Choose a player.'
          );
        }

        const x=
          await API.login(
            S.selectedPlayer,
            $('loginPin').value
          );

        S.token=x.token;

        localStorage.setItem(
          'bushnell_pickem_token',
          S.token
        );

        S.data=x.bootstrap;
        S.stageKey=S.data.currentStage;

        enterApp();

      }catch(e){
        err(e);
      }
    }
  );
}


async function logout(){
  stopLiveRefresh();

  await busyAction(
    'Signing out...',
    async()=>{
      try{
        await API.logout(S.token);
      }catch(e){}

      localStorage.removeItem(
        'bushnell_pickem_token'
      );

      location.reload();
    }
  );
}


/* =========================================================
   MAIN APP
   ========================================================= */

function enterApp(){
  showOnly('mainView');

  theme(
    S.data.player.favoriteTeam
  );

  $('seasonLabel').textContent=
    S.data.season+' SEASON';

  $('poolTitle').textContent=
    S.data.poolName.toUpperCase();

  $('userName').textContent=
    S.data.player.displayName;

  $('userBadge').innerHTML=
    teamLogoMarkup(
      S.data.player.favoriteTeam,
      32,
      'topbar-team-logo'
    );

  $('adminNav').classList.toggle(
    'hidden',
    !S.data.isAdmin
  );

  renderAll();
  startLiveRefresh();
}


function renderAll(){
  renderStageSelect();
  renderHome();
  renderPicks();
  renderBoard();
  renderLeaderboard();
  renderHistory();
  renderProfile(S.data.profile);
  renderAdmin();
}


function renderStageSelect(){
  const opts=
    (S.data.stages||[])
      .map(s=>`
        <option
          value="${s.key}"
          ${
            s.key===S.stageKey
              ?'selected'
              :''
          }
        >
          ${esc(s.name)}
        </option>
      `)
      .join('');

  $('stageSelect').innerHTML=opts;
}


/* =========================================================
   HOME
   ========================================================= */

function renderHome(){
  const lb=S.data.leaderboard||[];

  const gradedTotal=
    lb.reduce(
      (sum,row)=>
        sum+Number(row.graded||0),
      0
    );

  const lead=
    gradedTotal>0
      ?lb[0]
      :null;

  $('heroScore').innerHTML=
    lead
      ?`
        <div class="eyebrow">
          SEASON LEADER
        </div>

        <div class="hero-leader-row">

          ${teamLogoMarkup(
            lead.favoriteTeam,
            62,
            'hero-leader-logo'
          )}

          <div>

            <h3>
              ${esc(lead.displayName)}
              -
              ${lead.correct} correct
            </h3>

            <small>
              ${lead.accuracy}% accuracy
              -
              ${lead.roundWins} round wins
            </small>

          </div>

        </div>
      `
      :`
        <div class="eyebrow">
          READY FOR KICKOFF
        </div>

        <h3>
          ${esc(
            (S.data.stage||{}).name||
            stageLabel(S.stageKey)
          )}
          is open.
        </h3>

        <small>
          Make your picks before kickoff.
          Standings begin once games are graded.
        </small>
      `;

  const hist=
    S.data.history||[];

  const lastChamp=
    hist.find(
      x=>
        x.status==='FINAL' &&
        x.championNames
    );

  const stageRr=
    S.data.stageResults||{};

  const practiceRound=
    stageIsPractice(stageRr);

  const rr=
    practiceRound
      ?(S.data.preseasonResults||stageRr)
      :stageRr;

  const practiceLeaders=
    rr.leaders||[];

  let banner='';

  if(
    practiceRound &&
    practiceLeaders.length
  ){

    const names=
      practiceLeaders
        .map(
          x=>x.displayName
        )
        .join(' & ');

    banner=`
      <div class="champ-banner">

        <div class="eyebrow">
          ${
            rr.complete
              ?'PRESEASON CHAMPION'
              :'PRESEASON LEADER'
          }
        </div>

        <h3>
          ${esc(names)}
        </h3>

        <small>
          ${
            rr.complete
              ?(
                rr.actualTiebreak==null
                  ?'Preseason complete - cumulative preseason winner'
                  :'Preseason complete - final tiebreak actual: '+
                    rr.actualTiebreak
              )
              :(
                Number(rr.completedGames||0)+
                ' of '+
                Number(rr.totalGames||0)+
                ' preseason games graded - cumulative preseason standings'
              )
          }
        </small>

      </div>
    `;

  }else if(
    rr.complete &&
    (rr.winners||[]).length
  ){

    const names=
      (rr.rows||[])
        .filter(
          x=>
            (rr.winners||[])
              .includes(x.playerId)
        )
        .map(
          x=>x.displayName
        )
        .join(' & ');

    banner=`
      <div class="champ-banner winner-burst">

        <div class="eyebrow">
          ${esc(rr.stageName)} WINNER
        </div>

        <h3>
          ${esc(names)}
        </h3>

        <small>
          ${
            rr.actualTiebreak==null
              ?'Round complete'
              :'Tiebreak actual: '+
                rr.actualTiebreak
          }
        </small>

      </div>
    `;

  }else if(lastChamp){

    banner=`
      <div class="champ-banner">

        <div class="eyebrow">
          REIGNING CHAMPION
        </div>

        <h3>
          ${esc(lastChamp.championNames)}
        </h3>

        <small>
          ${lastChamp.season}
          Champion
        </small>

      </div>
    `;
  }

  $('champBanner').innerHTML=
    banner;

  $('pickStatus').innerHTML=
    (S.data.pickStatus||[])
      .map(x=>`
        <div class="status-row">

          <span
            class="
              status-dot
              ${x.complete?'good':''}
            "
          ></span>

          <div class="grow">

            <b>
              ${esc(x.displayName)}
            </b>

            <small>
              ${
                x.complete
                  ?'Complete'
                  :x.remaining+
                    ' remaining'
              }
            </small>

          </div>

          <b>
            ${x.picked}/${x.total}
          </b>

        </div>
      `)
      .join('')
    ||
    `
      <small>
        No games loaded for this round.
      </small>
    `;

  $('miniLeaderboard').innerHTML=
    lb.slice(0,5)
      .map(
        x=>leaderRow(
          x,
          true
        )
      )
      .join('')
    ||
    `
      <small>
        No scored games yet.
      </small>
    `;
}


/* =========================================================
   PICKS
   ========================================================= */

function renderPicks(){
  const st=
    S.data.stage||{};

  const games=
    st.games||[];

  const picks=
    (st.myPicks||{}).selections||{};

  $('picksStageTitle').textContent=
    st.name||
    stageLabel(S.stageKey);

  $('pickProgress').textContent=
    Object
      .keys(picks)
      .filter(
        id=>
          games.some(
            g=>
              g.gameId===id
          )
      )
      .length
    +' / '+
    games.length+
    ' picked';

  $('tiebreakLabel').textContent=
    st.tiebreakLabel||
    'Total points on the final game date';

  $('tiebreakValue').value=
    (st.myPicks||{})
      .tiebreaker??'';

  $('tiebreakValue').disabled=
    !!st.tiebreakLocked;

  $('gameList').innerHTML=
    games
      .map(
        g=>
          gameCard(
            g,
            picks[g.gameId],
            true
          )
      )
      .join('')
    ||
    `
      <div class="panel">
        No games loaded for this round.
        An admin can refresh the schedule.
      </div>
    `;
}


function gameCard(g,picked,interactive){
  const final=
    g.status==='FINAL';

  const live=
    g.status==='LIVE';

  const center=
    final||live
      ?`
        <div class="scoreline">

          <div>
            ${g.awayScore??'-'}
          </div>

          <small>
            ${live?'LIVE':'FINAL'}
          </small>

          <div>
            ${g.homeScore??'-'}
          </div>

        </div>
      `
      :`
        <div class="vs">
          AT
        </div>
      `;

  return `
    <div
      class="
        game-card
        ${final?'final':''}
        ${live?'live':''}
      "
      data-game="${g.gameId}"
    >

      <div class="game-meta">

        <span>
          ${fmtDate(g.kickoff)}
        </span>

        <span>
          ${esc(
            g.network||
            g.status||
            ''
          )}
        </span>

      </div>

      <div class="matchup">

        <button
          class="
            team-pick
            ${
              picked===g.awayAbbr
                ?'selected'
                :''
            }
          "
          ${
            (!interactive||g.locked)
              ?'disabled'
              :''
          }
          onclick="
            makePick(
              '${g.gameId}',
              '${g.awayAbbr}'
            )
          "
        >

          ${teamLogoMarkup(
            g.awayAbbr,
            54,
            'matchup-team-logo'
          )}

          <span class="team-abbr">
            ${esc(g.awayAbbr)}
          </span>

          <small>
            ${esc(g.awayName)}
          </small>

        </button>

        ${center}

        <button
          class="
            team-pick
            ${
              picked===g.homeAbbr
                ?'selected'
                :''
            }
          "
          ${
            (!interactive||g.locked)
              ?'disabled'
              :''
          }
          onclick="
            makePick(
              '${g.gameId}',
              '${g.homeAbbr}'
            )
          "
        >

          ${teamLogoMarkup(
            g.homeAbbr,
            54,
            'matchup-team-logo'
          )}

          <span class="team-abbr">
            ${esc(g.homeAbbr)}
          </span>

          <small>
            ${esc(g.homeName)}
          </small>

        </button>

      </div>

      <div class="game-meta">

        <span>
          ${
            g.locked
              ?'Picks locked'
              :'Open for picks'
          }
        </span>

        <span>
          ${esc(g.venue||'')}
        </span>

      </div>

    </div>
  `;
}


/* =========================================================
   SAVE PICK
   IMPORTANT: REFRESHES FULL CLIENT STATE AFTER SAVE
   ========================================================= */

async function makePick(gameId,team){
  await busyAction(
    'Saving '+team+' pick...',
    async()=>{
      try{
        await API.pick(
          S.token,
          gameId,
          team
        );

        /*
         * Pull a fresh app state plus the currently viewed stage.
         * This keeps Home, Picks, Board, Standings, round results,
         * profile totals and other derived data synchronized without
         * requiring a browser refresh.
         */
        await reloadState(false);

        markLiveRefreshNow();

        toast(
          team+' saved'
        );

      }catch(e){
        err(e);
      }
    }
  );
}


async function saveTiebreaker(){
  await busyAction(
    'Saving tiebreaker...',
    async()=>{
      try{
        const v=
          $('tiebreakValue').value;

        await API.tie(
          S.token,
          S.stageKey,
          v
        );

        S.data
          .stage
          .myPicks
          .tiebreaker=
            Number(v);

        toast(
          'Tiebreaker saved'
        );

      }catch(e){
        err(e);
      }
    }
  );
}


/* =========================================================
   ROUND / WEEK NAVIGATION
   ========================================================= */

async function changeStage(delta){
  const list=
    S.data.stages||[];

  const i=
    list.findIndex(
      s=>s.key===S.stageKey
    );

  const ni=
    Math.max(
      0,
      Math.min(
        list.length-1,
        i+delta
      )
    );

  if(ni===i){
    return;
  }

  await jumpStage(
    list[ni].key
  );
}


async function jumpStage(key){
  await busyAction(
    'Loading '+
    stageLabel(key)+
    '...',
    async()=>{
      try{
        const x=
          await API.stage(
            S.token,
            key
          );

        S.stageKey=key;

        S.data.stage=
          x.stage;

        S.data.pickStatus=
          x.pickStatus;

        S.data.stageResults=
          x.stageResults;

        S.data.preseasonResults=
          x.preseasonResults||S.data.preseasonResults;

        renderStageSelect();
        renderHome();
        renderPicks();
        renderBoard();
        renderLeaderboard();

        if(S.data.isAdmin){
          renderAdmin();
        }

      }catch(e){
        err(e);
      }
    }
  );
}


/* =========================================================
   PICK BOARD
   ========================================================= */

function renderBoard(){
  const games=
    S.data.stage||{};

  const list=
    games.games||[];

  $('boardList').innerHTML=
    list
      .map(g=>`
        <div class="game-card">

          <div class="game-meta">

            <span>
              ${fmtDate(g.kickoff)}
            </span>

            <span>
              ${
                g.locked
                  ?'REVEALED'

              )}

              <span class="team-abbr">
                ${esc(g.homeAbbr)}
              </span>

              <small>
                ${esc(g.homeName)}
              </small>

            </div>

          </div>

          <div
            class="board-picks"
            id="board-${g.gameId}"
          >

            ${
              g.locked
                ?`
                  <small class="muted">
                    Loading pool picks...
                  </small>
                `
                :`
                  <small class="muted">
                    Picks will appear here after kickoff.
                  </small>
                `
            }

          </div>

        </div>
      `)
      .join('')
    ||
    `
      <div class="panel">
        No games loaded.
      </div>
    `;

  list
    .filter(
      g=>g.locked
    )
    .forEach(
      g=>
        loadPublicPicks(
          g.gameId
        )
    );
}


async function loadPublicPicks(gameId){
  try{
    const rows=
      await API.publicPicks(
        S.token,
        gameId
      );

    const target=
      $(`board-${gameId}`);

    if(!target){
      return;
    }

    target.innerHTML=
      rows
        .map(p=>`
          <span class="pick-chip">

            ${esc(p.playerName)}:

            ${teamLogoMarkup(
              p.pickTeam,
              20,
              'pick-chip-logo'
            )}

            <b>
              ${esc(p.pickTeam)}
            </b>

          </span>
        `)
        .join('')
      ||
      `
        <small>
          No picks yet.
        </small>
      `;

  }catch(e){
    err(e);
  }
}

   STANDINGS
   ========================================================= */

function leaderRow(x,mini){
  const logoSize=
    mini ? 30 : 46;

  const currentPlayerId=
    S.data?.player?.playerId ||
    S.data?.player?.id ||
    '';

  const rowPlayerId=
    x.playerId ||
    x.id ||
    '';

  const isMe=
    !!currentPlayerId &&
    !!rowPlayerId &&
    currentPlayerId===rowPlayerId;

  return `
    <div class="
      leader-row
      ${isMe ? 'current-player' : ''}
    ">

      <span class="rank">
        #${x.rank}
      </span>

      <div class="leader-logo-wrap">

        ${teamLogoMarkup(
          x.favoriteTeam,
          logoSize,
          mini
            ?'mini-leader-logo'
            :'leader-team-logo'
        )}

      </div>

      <div class="grow">

        <div class="leader-name-line">
          <b>
            ${esc(x.displayName)}
          </b>

          ${
            isMe
              ?'<span class="you-tag">YOU</span>'
              :''
          }
        </div>

        <small>
          ${x.graded} graded picks
        </small>

      </div>

      <div class="metric">

        <b>
          ${x.correct}
        </b>

        <small>
          CORRECT
        </small>

      </div>

      ${
        mini
          ?''
          :`
            <div class="metric">

              <b>
                ${x.accuracy}%
              </b>

              <small>
                ACCURACY
              </small>

            </div>

            <div class="metric">

              <b>
                ${x.roundWins}
              </b>

              <small>
                ROUND WINS
              </small>

            </div>
          `
      }

    </div>
  `;
}


function renderLeaderboard(){
  $('leaderboard').innerHTML=
    (S.data.leaderboard||[])
      .map(
        x=>
          leaderRow(
            x,
            false
          )
      )
      .join('')
    ||
    `
      <div class="panel">
        No standings yet.
      </div>
    `;

  const stageRr=
    S.data.stageResults||{};

  const practiceRound=
    stageIsPractice(stageRr);

  const r=
    practiceRound
      ?(S.data.preseasonResults||stageRr)
      :stageRr;

  $('roundResultsTitle').textContent=
    practiceRound
      ?'Preseason Standings'
      :(
          (
            r.stageName||
            stageLabel(S.stageKey)
          )
          +' Results'
        );

  $('roundResults').innerHTML=
    (r.rows||[])
      .map(x=>`
        <div class="result-row">

          <div class="grow">

            <b>
              ${esc(x.displayName)}
            </b>

            <small>
              ${
                r.complete
                  ?(
                    (r.winners||[])
                      .includes(x.playerId)
                      ?(
                        practiceRound
                          ?'PRESEASON CHAMPION'
                          :'ROUND WINNER'
                      )
                      :'Final'
                  )
                  :(
                    practiceRound &&
                    x.leading
                      ?'PRESEASON LEADER'
                      :'In progress'
                  )
              }
            </small>

          </div>

          <b>
            ${x.correct}/${
              practiceRound &&
              !r.complete
                ?Number(x.completedGames||0)
                :x.totalGames
            }
          </b>

          <span>
            ${
              x.tiebreakDiff==null
                ?''
                :'TB '+x.tiebreakDiff
            }
          </span>

        </div>
      `)
      .join('')
    ||
    `
      <small>
        No results yet.
      </small>
    `;
}

function toDateTimeLocalValue(value){
  if(!value){
    return '';
  }

  const d=
    value instanceof Date
      ?value
      :new Date(value);

  if(Number.isNaN(d.getTime())){
    return '';
  }

  const pad=n=>
    String(n).padStart(2,'0');

  return (
    d.getFullYear()+
    '-'+pad(d.getMonth()+1)+
    '-'+pad(d.getDate())+
    'T'+pad(d.getHours())+
    ':'+pad(d.getMinutes())
  );
}


function adminLoadManualGame(){
  const id=
    String($('mGameId')?.value||'')
      .trim();

  if(!id){
    toast(
      'Enter a Game ID first',
      true
    );
    return;
  }

  const games=
    S.data?.stage?.games||[];

  const game=
    games.find(
      g=>
        String(g.gameId??'')
          .trim()===id
    );

  if(!game){
    toast(
      'Game ID not found in this round',
      true
    );
    return;
  }

  const kickoff=
    toDateTimeLocalValue(
      game.kickoff
    );

  if(!kickoff){
    toast(
      'Game found, but its kickoff time is invalid',
      true
    );
    return;
  }

  $('mAway').value=
    game.awayAbbr||'';

  $('mHome').value=
    game.homeAbbr||'';

  $('mKick').value=
    kickoff;

  $('mStatus').value=
    game.status||'SCHEDULED';

  $('mAwayScore').value=
    game.awayScore==null
      ?''
      :game.awayScore;

  $('mHomeScore').value=
    game.homeScore==null
      ?''
      :game.homeScore;

  toast(
    'Game loaded'
  );
}


async function adminManualGame(){
  const kickoff=
    String($('mKick')?.value||'')
      .trim();

  if(!kickoff){
    toast(
      'Enter a kickoff date and time',

    );
    return;
  }

  const parsedKickoff=
    new Date(kickoff);

  if(Number.isNaN(parsedKickoff.getTime())){
    toast(
      'Invalid kickoff date/time',
      true
    );
    return;
  }

  await busyAction(
    'Saving game...',
    async()=>{
      try{
        await API.manual(
          S.token,
          {
            gameId:
              String($('mGameId').value||'')
                .trim(),

            season:
              S.data.season,

            stageKey:
              S.stageKey,

            awayAbbr:
              $('mAway').value,

            homeAbbr:
              $('mHome').value,

            kickoff,

            status:
              $('mStatus').value,

              $('mAwayScore').value,

              $('mHomeScore').value

        markLiveRefreshNow();

        toast(
          'Manual game saved'
        );

      }catch(e){
        err(e);
      }
    }
  );
}


/* =========================================================
   STATE REFRESH
   ========================================================= */

const LIVE_REFRESH_MS=45000;
const LIVE_REFRESH_MIN_GAP_MS=8000;

let LIVE_REFRESH_TIMER=null;
let LIVE_REFRESH_IN_FLIGHT=false;
let LAST_LIVE_REFRESH=0;


function markLiveRefreshNow(){
  LAST_LIVE_REFRESH=Date.now();
}


function currentPageName(){
  const active=
    document.querySelector('.page.active');

  return active
    ?active.id
    :'';
}


function startLiveRefresh(){
  stopLiveRefresh();
  markLiveRefreshNow();

  LIVE_REFRESH_TIMER=
    setInterval(
      ()=>refreshLiveState(false),
      LIVE_REFRESH_MS
    );
}


function stopLiveRefresh(){
  if(LIVE_REFRESH_TIMER){
    clearInterval(LIVE_REFRESH_TIMER);
    LIVE_REFRESH_TIMER=null;
  }
}


async function refreshLiveState(force=false){
  if(
    !S.token ||
    !S.data ||
    LIVE_REFRESH_IN_FLIGHT ||
    BUSY_COUNT>0 ||
    document.hidden
  ){
    return;
  }

  /*
   * Do not silently rebuild the Admin page while somebody may be
   * typing into a form. Admin actions already refresh state after save.
   */
  if(currentPageName()==='pageAdmin'){
    return;
  }

  const now=Date.now();

  if(
    !force &&
    now-LAST_LIVE_REFRESH<LIVE_REFRESH_MIN_GAP_MS
  ){
    return;
  }

  LIVE_REFRESH_IN_FLIGHT=true;

  try{
    await reloadState(false);
    markLiveRefreshNow();

  }catch(e){
    /*
     * A background refresh should never interrupt the player with an
     * error toast. The next navigation, action or interval will retry.
     */
    console.warn(
      'Background refresh failed:',
      e
    );

  }finally{
    LIVE_REFRESH_IN_FLIGHT=false;
  }
}


async function reloadState(resetStage=true){
  S.data=
    await API.state(
      S.token
    );

  if(resetStage){
    S.stageKey=
      S.data.currentStage;

  }else{
    const x=
      await API.stage(
        S.token,
        S.stageKey
      );

    S.data.stage=
      x.stage;

    S.data.pickStatus=
      x.pickStatus;

    S.data.stageResults=
      x.stageResults;

    S.data.preseasonResults=
      x.preseasonResults||S.data.preseasonResults;
  }

  renderAll();
}


document.addEventListener(
  'visibilitychange',
  ()=>{
    if(!document.hidden){
      refreshLiveState(true);
    }
  }
);

    btn.classList.add('active');

  if(name==='Profile'){
    renderProfile(
      S.data.profile
    );

  /*
   * Navigation is also a natural refresh point. This lets Home,
   * Board and Standings pick up server-side score/status changes
   * immediately instead of waiting for a full browser reload.
   */
  if(name!=='Admin'){
    refreshLiveState(false);
  }
}

function fmtDate(v){
  try{
    return new Intl.DateTimeFormat(
      undefined,
      {
        weekday:'short',
        month:'short',
        day:'numeric',
        hour:'numeric',
        minute:'2-digit'
      }
    )
      .format(
        new Date(v)
      );

  }catch(e){
    return v;
  }
}


function esc(s){
  return String(s??'')
    .replace(
      /[&<>"']/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
}


function toast(msg,bad=false){
  const el=
    $('toast');

  el.textContent=
    msg;

  el.classList.toggle(
    'bad',
    bad
  );

  el.classList.add(
    'show'
  );

  clearTimeout(
    toast._t
  );

  toast._t=
    setTimeout(
      ()=>
        el.classList.remove('show'),
      2800
    );
}


function err(e){
  const msg=
    e&&e.message
      ?e.message
      :String(e);

  toast(
    msg.replace(
      /^Exception:\s*/,
      ''
    ),
    true
  );
}
